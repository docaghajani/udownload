<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDM — Web UI</title>
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23E95420' stroke-width='2.6'/%3E%3Cpath d='M16 10v8M11.6 15l4.4 4.4 4.4-4.4' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="mark" width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E95420"/>
          <stop offset="1" stop-color="#ff7a45"/>
        </linearGradient>
      </defs>
      <rect width="32" height="32" rx="8" fill="#1c2635"/>
      <circle cx="16" cy="16" r="10.2" fill="none" stroke="url(#markGrad)" stroke-width="2.6"/>
      <path d="M16 10.2v7.6M11.8 14.8l4.2 4.2 4.2-4.2" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>UDM</span>
    <span class="badge">web</span>
  </div>
  <div class="engine-status">
    <span class="dot" id="engineDot"></span>
    <span id="engineLabel">Checking engine…</span>
    <button type="button" class="btn ghost sm" id="logoutBtn">Log out</button>
  </div>
</header>

<main class="container">
  <section class="card add-card">
    <form id="addForm">
      <div class="row">
        <input type="url" id="urlInput" placeholder="Paste a download link — https://example.com/file.iso" autocomplete="off" required>
        <button type="submit" class="btn primary" id="addNowBtn">Download now</button>
        <button type="button" class="btn ghost" id="addQueueBtn">Add to queue</button>
      </div>
      <button type="button" class="link-toggle" id="moreOptionsToggle">More options</button>
      <div class="row more-options" id="moreOptions" hidden>
        <label class="field">
          <span>Save to (on the UDM machine)</span>
          <input type="text" id="pathInput" placeholder="Default download folder">
        </label>
        <label class="field">
          <span>Start at</span>
          <input type="datetime-local" id="scheduleInput">
        </label>
        <button type="button" class="btn ghost" id="scheduleBtn">Schedule</button>
      </div>
    </form>
    <p class="error-line" id="addError" hidden></p>
  </section>

  <section class="toolbar">
    <div class="tabs" id="categoryTabs"></div>
    <div class="toolbar-actions">
      <input type="search" id="searchInput" placeholder="Search downloads…">
      <button type="button" class="btn ghost sm" id="pauseAllBtn">Pause all</button>
      <button type="button" class="btn ghost sm" id="resumeAllBtn">Resume all</button>
      <button type="button" class="btn ghost sm" id="clearCompletedBtn">Clear completed</button>
    </div>
  </section>

  <section class="card list-card">
    <div id="emptyState" class="empty-state" hidden>
      <p>No downloads here yet.</p>
      <p class="muted">Paste a link above to get started.</p>
    </div>
    <ul id="downloadList" class="download-list"></ul>
  </section>

  <p class="footnote">
    Web UI is intended for a trusted LAN or VPN. Downloads run on the UDM machine via aria2.
  </p>
</main>

<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
