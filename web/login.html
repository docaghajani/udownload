<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDM — Sign in</title>
<meta name="theme-color" content="#0b1220">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main class="login-shell">
  <section class="login-card" aria-labelledby="loginTitle">
    <div class="brand">
      <svg class="mark" width="48" height="48" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#E95420"/>
            <stop offset="1" stop-color="#ff7a45"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="8" fill="#1c2635"/>
        <circle cx="16" cy="16" r="10.2" fill="none" stroke="url(#markGrad)" stroke-width="2.6"/>
        <path d="M16 10.2v7.6M11.8 14.8l4.2 4.2 4.2-4.2" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="brand-title">UDM</div>
        <div class="brand-subtitle">Ubuntu Download Manager</div>
      </div>
    </div>

    <h1 id="loginTitle">Sign in to Web UI</h1>
    <p class="intro">Enter the username and password configured in UDM Options.</p>

    <form id="loginForm" autocomplete="off">
      <label>
        <span>Username</span>
        <input id="username" name="username" type="text" maxlength="64" autocomplete="username" required autofocus>
      </label>
      <label>
        <span>Password</span>
        <input id="password" name="password" type="password" maxlength="256" autocomplete="current-password" required>
      </label>
      <button id="loginButton" type="submit">Sign in</button>
      <p id="loginError" class="error" hidden></p>
    </form>

    <p class="security-note">Authentication is required for every new Web UI session. No “remember me” credential is stored by UDM.</p>
  </section>
</main>
<script src="/login.js"></script>
</body>
</html>
